spring:
  # Base dediee aux tests, distincte de la base de developpement, pour qu'un
  # ./gradlew test ne detruise jamais les donnees en cours de manipulation.
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/fitcoach_test}
    username: ${DB_USER:fitcoach}
    password: ${DB_PASSWORD:fitcoach}

  jpa:
    show-sql: false

  flyway:
    clean-disabled: false

logging:
  level:
    com.fitcoach: DEBUG

app:
  jwt:
    # Valeur de repli uniquement active en profil test ; JWT_SECRET reste prioritaire.
    secret: ${JWT_SECRET:test-only-secret-key-please-rotate-32bytes-min}
  # Hors de ./uploads pour que les fichiers deposes par les tests restent dans build/.
  uploads:
    dir: build/test-uploads

  notifications:
    # Le job de rappels est coupe en test : les tests appellent SessionReminderService directement.
    scheduling-enabled: false
