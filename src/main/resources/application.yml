spring:
  application:
    name: fitcoach-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitcoach}
    username: ${DB_USER:fitcoach}
    password: ${DB_PASSWORD:fitcoach}

  jpa:
    # validate et jamais update : Flyway est la seule source de verite du schema.
    # Hibernate se contente de verifier que les entites correspondent aux migrations.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Les instants sont stockes en UTC quel que soit le fuseau de la JVM ;
        # la conversion vers le fuseau metier se fait explicitement (app.time-zone).
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Java 21 : un thread virtuel par requete.
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  # Fuseau des notions metier (aujourd'hui, semaine courante, series de jours).
  time-zone: ${APP_TIME_ZONE:Europe/Paris}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    # 32 caracteres minimum (HS256). Pas de valeur par defaut ici : JWT_SECRET est
    # obligatoire hors profil dev/test, pour ne jamais demarrer en prod avec un
    # secret connu publiquement. Le profil dev fournit sa propre valeur de repli.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}

# Generation de programmes par IA (phase 12). Sans cle, l'endpoint repond 503 et
# le reste de l'application fonctionne normalement.
fitcoach:
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
    base-url: https://api.anthropic.com
    timeout-seconds: 120
