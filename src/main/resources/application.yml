spring:
  application:
    name: fitcoach-backend

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitcoach}
    username: ${DB_USER:fitcoach}
    password: ${DB_PASSWORD:fitcoach}

  jpa:
    # validate et jamais update : Flyway est la seule source de verite du schema.
    # Hibernate se contente de verifier que les entites correspondent aux migrations.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Java 21 : un thread virtuel par requete.
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    # 32 caracteres minimum (HS256) ; a definir via JWT_SECRET en dehors du dev local.
    secret: ${JWT_SECRET:dev-only-secret-key-please-rotate-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
