<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FitCoach - carnet d'entrainement, programmes et coaching." />
    <meta name="theme-color" content="#6051f2" />
    <title>FitCoach</title>
    <script>
      // Applique le theme avant le premier rendu pour eviter un flash clair.
      try {
        const t = localStorage.getItem('fitcoach-theme') ?? 'system'
        const dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        const palette = localStorage.getItem('fitcoach-palette') ?? 'aurora'
        document.documentElement.dataset.palette = palette
        const colors = {
          aurora: '#6051f2',
          emerald: '#00854c',
          ocean: '#0075cb',
          sunset: '#d03e00',
        }
        if (colors[palette])
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', colors[palette])
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
