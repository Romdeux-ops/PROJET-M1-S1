<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FitCoach - carnet d'entrainement, programmes et coaching." />
    <meta name="theme-color" content="#f97316" />
    <title>FitCoach</title>
    <script>
      // Applique le theme avant le premier rendu pour eviter un flash clair.
      try {
        const t = localStorage.getItem('fitcoach-theme') ?? 'system'
        const dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
